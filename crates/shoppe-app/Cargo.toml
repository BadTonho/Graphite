[package]
name = "shoppe-app"
default-run = "graphite"
autobins = false
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
shoppe-core-api = { path = "../shoppe-core-api" }
shoppe-extension-host = { path = "../shoppe-extension-host" }
winit = "0.30"
shoppe-text = { path = "../shoppe-text" }
shoppe-workspace = { path = "../shoppe-workspace" }
shoppe-render = { path = "../shoppe-render" }
shoppe-syntax = { path = "../shoppe-syntax" }
arboard = "3.6.1"
serde_json = "1.0"
jsonschema = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
accesskit = "0.24.1"
accesskit_winit = "0.32.2"
lsp-server = "0.7.8"
lsp-types = "0.97.0"
portable-pty = "0.8.1"
alacritty_terminal = "0.25.1"
gix = "0.90"
interprocess = "2.4"
notify = "8.2"
similar = "2.7"
sysinfo = "0.40"

[[bin]]
name = "graphite"
path = "src/main.rs"

[[bin]]
name = "code"
path = "src/bin/code.rs"
