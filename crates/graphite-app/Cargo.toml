[package]
name = "graphite-app"
default-run = "graphite"
autobins = false
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
graphite-core-api = { path = "../graphite-core-api" }
graphite-extension-host = { path = "../graphite-extension-host" }
graphite-i18n = { path = "../graphite-i18n" }
graphite-plugins = { path = "../graphite-plugins" }
winit = "0.30"
graphite-text = { path = "../graphite-text" }
graphite-workspace = { path = "../graphite-workspace" }
graphite-render = { path = "../graphite-render" }
graphite-syntax = { path = "../graphite-syntax" }
arboard = "3.6.1"
serde_json = "1.0"
jsonschema = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
accesskit = "0.24.1"
accesskit_winit = "0.32.2"
lsp-server = "0.7.8"
lsp-types = "0.97.0"
portable-pty = "0.8.1"
alacritty_terminal = "0.25.1"
gix = "0.90"
interprocess = "2.4"
notify = "8.2"
similar = "2.7"
sysinfo = "0.40"
regex = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
wry = "0.57.1"
rfd = { version = "0.16.0", default-features = false, features = ["gtk3"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winresource = "0.1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

[[bin]]
name = "graphite"
path = "src/main.rs"

[[bin]]
name = "code"
path = "src/bin/code.rs"

# Local protocol fixture; never launched by the editor's default configuration.
[[bin]]
name = "graphite-test-lsp"
path = "tests/fixtures/lsp_server.rs"
test = false
doc = false
