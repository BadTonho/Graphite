[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Dependencies are optimized in debug builds too: rendering, parsing, regex, and text shaping
# crates run many times slower unoptimized, which slows `cargo run` and the tests. The
# workspace's own crates stay unoptimized, so they rebuild quickly and debug well.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

