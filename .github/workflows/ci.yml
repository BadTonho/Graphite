name: CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache cargo dependencies and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Saves the cache even when tests fail, so the next run starts warm.
          cache-on-failure: true

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            pkg-config

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Build workspace
        run: cargo build --workspace

      - name: Build test helper binaries
        run: |
          cargo build -p graphite-app --bin graphite-test-lsp
          cargo build -p graphite-extension-host --bin graphite-extension-host

      - name: Verify test helper binaries
        shell: bash
        run: |
          for bin in graphite-test-lsp graphite-extension-host; do
            found=$(ls target/debug/$bin target/debug/$bin.exe 2>/dev/null || true)
            if [ -z "$found" ]; then
              echo "::error::missing test helper binary: $bin"
              ls -la target/debug || true
              exit 1
            fi
          done

      - name: Run workspace tests
        run: cargo test --workspace -- --test-threads=4
